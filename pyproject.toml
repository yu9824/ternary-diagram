# https://packaging.python.org/ja/latest/guides/writing-pyproject-toml/
[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm[toml]>=7"]
build-backend = "setuptools.build_meta"

[project]
name = "ternary-diagram"
dynamic = ["version"]
dependencies = ["numpy >=1.20", "matplotlib"]
requires-python = ">= 3.9"
authors = [{ name = "yu9824" }]
maintainers = [{ name = "yu9824" }]
description = "Draw beautiful ternary diagrams with matplotlib, without pymatgen."
readme = { file = "README.md", content-type = "text/markdown" }
# https://spdx.org/licenses/
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = [
    "ternary diagram",
    "ternary plot",
    "phase diagram",
    "composition",
    "contour",
    "matplotlib",
    "materials science",
    "chemistry",
    "visualization",
]
# https://pypi.org/classifiers/
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
] # https://pypi.org/classifiers/

[project.optional-dependencies]
test = ["pytest", "pandas"]
dev = ["build", "jupyter", "jupytext", "pandas"]
docs = [
    "sphinx",
    "myst-parser",
    "myst-nb",
    "sphinx-book-theme",
    "jupyter-sphinx",
]

[project.urls]
Homepage = "https://github.com/yu9824/ternary-diagram"
Documentation = "https://yu9824.github.io/ternary-diagram/"
PyPI = "https://pypi.org/project/ternary-diagram/"
Source = "https://github.com/yu9824/ternary-diagram"
Tracker = "https://github.com/yu9824/ternary-diagram/issues"
"Release Notes" = "https://github.com/yu9824/ternary-diagram/releases"
Changelog = "https://github.com/yu9824/ternary-diagram/blob/main/CHANGELOG.md"

[project.scripts]
ternary-diagram = "ternary_diagram.__main__:entrypoint"

# [project.gui-scripts]
# ternary-diagram-gui = "ternary_diagram:main_gui"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src/"]

[tool.setuptools_scm]
write_to = "src/ternary_diagram/_version.py"
